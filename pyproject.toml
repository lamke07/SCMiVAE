[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scmivae"
dynamic = ["version"]
description = "Structural causal modelling and identifiable variational autoencoders (iVAE) for single-cell data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Lam", email = "kevin.lam@stat.ubc.ca" }]
keywords = ["variational autoencoder", "vae", "ivae", "single-cell", "pytorch", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",  # tested on 2.7.1; torch.func.jacfwd needs >=2.0
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
adata = ["anndata>=0.8.0", "scipy>=1.7.0"]

# Add once the code is on GitHub:
# [project.urls]
# Source = "https://github.com/lamke07/scmivae"

[tool.setuptools]
packages = ["scmivae"]

[tool.setuptools.dynamic]
version = { attr = "scmivae.__version__" }
